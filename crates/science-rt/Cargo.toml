[package]
name = "science-rt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Minimal runtime statically linked into every Science binary."

# `rlib` so the compiler's own test suite and the integration tests here can
# link it as a Rust crate; `staticlib` so `sciencec` can hand the archive to the
# system linker when producing a native Science binary.
[lib]
crate-type = ["rlib", "staticlib"]

