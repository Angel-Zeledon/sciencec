[workspace]
resolver = "2"
members = [
    "crates/science-diagnostics",
    "crates/science-lexer",
    "crates/science-parser",
    "crates/science-testkit",
    "crates/science-resolve",
    "crates/science-db",
    "crates/science-rt",
    "crates/sciencec",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
science-diagnostics = { path = "crates/science-diagnostics" }
science-lexer = { path = "crates/science-lexer" }
science-parser = { path = "crates/science-parser" }
science-testkit = { path = "crates/science-testkit" }
science-resolve = { path = "crates/science-resolve" }
science-db = { path = "crates/science-db" }
science-rt = { path = "crates/science-rt" }
sciencec = { path = "crates/sciencec" }
insta = "1"
